/* V1.1: preview is off by default; only render canvas while debug preview is enabled. */
.preview-toggle{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:11px;color:#c1cbe0}
.preview-toggle .toggle{margin:0}
.preview-disabled{min-height:142px;border:1px dashed #435069;border-radius:10px;background:radial-gradient(ellipse at 50% 30%,#202639,#131b2a 68%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;padding:28px 20px;margin:12px}
.preview-disabled .ico{width:24px;height:24px;color:#9d95cb}
.preview-disabled strong{font-size:13px;color:#d8e0ed}
.preview-disabled p{margin:0;color:#8b9cb4;font-size:11px;line-height:1.7;max-width:490px}
.preview-disabled .btn{margin-top:2px}
.key-config-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.key-config-grid .field{margin-bottom:0}
.key-option-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.key-option-bar .btn{white-space:normal}
.hotkey-scope-note{font-size:11px;color:#aab7ca;line-height:1.7;margin:9px 0 14px}
.hotkey-class-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:8px 0 12px}
.hotkey-class-item{padding:8px 10px;border:1px solid #354056;border-radius:9px;background:#141b28;font-size:11px;display:flex;gap:7px;align-items:center;cursor:pointer}
.hotkey-class-item input{accent-color:#af90ff}
.hotkey-class-item span:last-child{color:#8393aa;font-size:10px}
.hotkey-hint{border:1px solid #34435c;background:#192638;border-radius:9px;padding:10px 12px;color:#a9c7e9;font-size:11px;line-height:1.7;margin-bottom:15px}
.hotkey-test-zone{border:1px dashed #8d79bc;border-radius:11px;background:linear-gradient(135deg,#24213a,#192136);min-height:144px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;text-align:center;padding:17px;margin:12px 0;user-select:none;-webkit-user-select:none;touch-action:none;cursor:crosshair}
.hotkey-test-zone:focus-visible{outline:2px solid #c0a4ff;outline-offset:3px}
.hotkey-test-zone strong{font-size:14px}
.hotkey-test-zone p{font-size:11px;color:#a5b0ca;margin:0;line-height:1.7}
.key-pressed-group{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.key-pressed{border-radius:6px;background:#121826;border:1px solid #48516f;color:#a3adc0;font-weight:750;padding:8px 12px;font-size:12px;min-width:96px}
.key-pressed.pressed{border-color:#4bcca4;background:#19483e;color:#8ef2d2;box-shadow:0 0 0 2px #4acaa31c}
.hotkey-test-state{font-size:11px;color:#f3cc8f}
.hotkey-test-state.on{color:#80ebc4}
.key-status-panel{border:1px solid #354054;border-radius:9px;background:#141c2a;padding:10px 12px;font-size:11px;color:#bbc5d9;line-height:1.6}

<script>
(()=>{'use strict';
const STORE='ndi-ai-vision-v1-prototype-2026';
const ICON=n=>`<svg class="ico" aria-hidden="true"><use href="#i-${n}"></use></svg>`;
const pageInfo={dashboard:['总览','实时监控与自动化状态','grid'],devices:['设备连接','NDI 视频源与 KMBox NET 配置','monitor'],inference:['推理设置','模型、GPU 与推理后端','cpu'],hotkeys:['热键管理','多组热键与独立操作策略','keyboard'],targets:['目标识别','类别筛选、目标优先级与识别范围','crosshair'],motion:['鼠标控制','相对位移、校准与平滑轨迹','mouse'],logs:['运行日志','查看演示状态变化和故障记录','file']};
const classes=['diren','direntou','duiyou','ai','daodi','class_5','class_6'];
const classColors=['#b99cff','#62d6f6','#53dbb2','#ffd188','#f69bbd','#91aeff','#debb87'];
const defaults=()=>({ndiConnected:false,kmConnected:false,recognition:false,automation:false,paused:false,source:'source-1',discovered:false,ndiSource:'NDI Desktop / 设备 A',ndiResolution:'1920 × 1080',ndiFps:60,previewEnabled:false,previewFps:15,kmIp:'192.168.1.88',kmPort:'12498',kmUuid:'',kmEncrypt:false,engine:'trt',precision:'fp16',fpsCap:120,engineCache:true,modelName:'1013v26s_640.onnx',conf:.55,iou:.50,targetPolicy:'nearest',range:260,offsetX:0,offsetY:.10,enabledClasses:[0,1,2,3,4,5,6],overlay:true,rangeOverlay:true,referenceX:.5,referenceY:.5,smooth:true,curve:'ease',speedX:.56,speedY:.56,gainX:1,gainY:1,deadzone:2.5,maxStep:50,autoStop:true,hotkeys:[{id:1,name:'热键 1 · 全类别组合跟随',key:'MouseRight+MouseLeft',keys:['MouseRight','MouseLeft'],trigger:'combo',mode:'hold',scope:'all',classId:0,classIds:[0,1,2,3,4,5,6],conf:.55,enabled:true},{id:2,name:'热键 2 · 侧键跟随',key:'Mouse5',keys:['Mouse5'],trigger:'single',mode:'hold',scope:'single',classId:1,classIds:[1],conf:.7,enabled:true},{id:3,name:'热键 3 · 键盘切换',key:'F6',keys:['F6'],trigger:'single',mode:'toggle',scope:'all',classId:0,classIds:[0,1,2,3,4,5,6],conf:.55,enabled:true}],selectedHotkey:1,activeHotkeyId:null,benchmark:null,logs:[]});
let s=defaults();let page='dashboard';let recording=null;let animationId=0;let lastRenderTS=0;let lastStatsTS=0;let busy=false;const downKeys=new Set(), demoHeld=new Set(), keyLatch=new Set();let activeHoldId=null;
try{const v=JSON.parse(localStorage.getItem(STORE)||'null');if(v&&typeof v==='object'){s={...s,...v,logs:[],ndiConnected:false,kmConnected:false,recognition:false,automation:false,paused:false,activeHotkeyId:null,benchmark:null};if(!Array.isArray(s.hotkeys))s.hotkeys=defaults().hotkeys;}}catch(e){}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>Number(x).toFixed(2);
const hotkeyOptions=[['MouseLeft','鼠标左键'],['MouseRight','鼠标右键'],['MouseMiddle','鼠标中键'],['Mouse4','鼠标侧键 1 · Mouse4'],['Mouse5','鼠标侧键 2 · Mouse5'],['Ctrl','Ctrl'],['Shift','Shift'],['Alt','Alt'],['Space','空格'],...Array.from({length:12},(_,i)=>['F'+(i+1),'F'+(i+1)]),...Array.from({length:26},(_,i)=>{const c=String.fromCharCode(65+i);return [c,c]})];
const hotkeyNames=Object.fromEntries(hotkeyOptions);
const prettyKey=k=>hotkeyNames[k]||k;
function normalizeHotkeys(){s.hotkeys=s.hotkeys.map(h=>{const old=Array.isArray(h.keys)&&h.keys.length?h.keys:String(h.key||'F6').split('+');const keys=old.map(k=>k==='Control'?'Ctrl':k===' '||k==='Spacebar'?'Space':k).filter(Boolean).slice(0,2);const trigger=h.trigger==='single'||h.trigger==='combo'?h.trigger:keys.length>1?'combo':'single';return {...h,keys:trigger==='combo'?[keys[0]||'MouseRight',keys[1]||'MouseLeft']:[keys[0]||'F6'],trigger,scope:['all','single','custom'].includes(h.scope)?h.scope:'single',classIds:Array.isArray(h.classIds)?h.classIds:[h.classId??0]};});if(!s.hotkeys.some(h=>h.id===s.selectedHotkey))s.selectedHotkey=s.hotkeys[0]?.id??1;}
normalizeHotkeys();
const bindingKeys=h=>h?(h.trigger==='combo'?h.keys.slice(0,2):h.keys.slice(0,1)):[];
const bindingLabel=h=>bindingKeys(h).map(prettyKey).join(' + ');
const classSetFor=h=>!h?[]:h.scope==='all'?s.enabledClasses:h.scope==='custom'?h.classIds.filter(i=>s.enabledClasses.includes(i)):[h.classId].filter(i=>s.enabledClasses.includes(i));
const normalizedSignature=h=>[...new Set(bindingKeys(h))].sort().join('|');
function selectedHotkey(){return s.hotkeys.find(h=>h.id===s.selectedHotkey)||s.hotkeys[0];}
const stamp=()=>new Date().toLocaleTimeString('zh-CN',{hour12:false});
const save=()=>{try{const x={...s,ndiConnected:false,kmConnected:false,recognition:false,automation:false,paused:false,activeHotkeyId:null,benchmark:null,logs:[]};localStorage.setItem(STORE,JSON.stringify(x));}catch(e){}};
function log(level,message){s.logs.unshift({time:stamp(),level,message});s.logs=s.logs.slice(0,120);}
function toast(message,type='info'){const area=document.getElementById('toasts');let div=document.createElement('div');div.className='toast '+type;div.textContent=message;area.appendChild(div);setTimeout(()=>{div.remove()},3400);}
function stateBadge(on,yes,no){return `<span class="badge ${on?'ok':'muted'}">${on?'●':'○'} ${on?yes:no}</span>`}
function heading(title,desc,buttons=''){return `<div class="page-heading"><div><div class="eyebrow">VISION / ${esc(page.toUpperCase())}</div><h1 class="page-title">${title}</h1><p class="page-desc">${desc}</p></div>${buttons?`<div class="page-tools">${buttons}</div>`:''}</div>`}
function nav(){return `<aside class="side"><div class="brand"><div class="brand-mark">${ICON('eye')}</div><div><div class="brand-name">NDI Vision Studio</div><div class="brand-small">AI CONTROL SYSTEM</div></div></div><div class="nav-label">工作区</div><div class="nav">${['dashboard','devices','inference'].map(k=>navBtn(k)).join('')}</div><div class="nav-label">自动化配置</div><div class="nav">${['hotkeys','targets','motion'].map(k=>navBtn(k)).join('')}</div><div class="nav-label">系统</div><div class="nav">${navBtn('logs')}</div><div class="side-bottom"><div class="machine"><div class="machine-header"><span>双机架构</span><span class="badge muted">LAN</span></div><div class="machine-flow"><span class="machine-node">设备 A</span>${ICON('arrow')}<span class="machine-node">设备 B</span></div><div class="machine-note">A：NDI 推流 + KMBox USB 输入<br/>B：运行本软件 + AI 推理</div></div><div class="version">INTERACTIVE PROTOTYPE · V1.1</div></div></aside>`}
function navBtn(k){return `<button class="nav-btn ${page===k?'active':''}" data-action="nav" data-page="${k}" title="${pageInfo[k][0]}">${ICON(pageInfo[k][2])}<span>${pageInfo[k][0]}</span></button>`}
function topbar(){return `<header class="topbar"><div class="crumb"><span class="mobilehide">NDI Vision Studio</span><span class="mobilehide">/</span><strong>${pageInfo[page][0]}</strong></div><div class="top-actions"><span class="status-pill demo">● 交互演示模式</span><span class="status-pill mobilehide"><span class="live-dot" style="background:${s.automation?'#4cd7ab':'#8994ab'};box-shadow:none"></span>${s.automation?'自动控制中':s.recognition?'正在识别':'待机'}</span><button class="btn btn-ghost btn-sm" data-action="import">${ICON('upload')}<span class="mobilehide">导入配置</span></button><button class="btn btn-ghost btn-sm" data-action="export">${ICON('download')}<span class="mobilehide">导出配置</span></button><button class="btn btn-danger btn-sm" data-action="emergency">${ICON('stop')} 紧急停止</button></div></header>`}
function render(){const sections={dashboard:renderDashboard,devices:renderDevices,inference:renderInference,hotkeys:renderHotkeys,targets:renderTargets,motion:renderMotion,logs:renderLogs};document.getElementById('app').innerHTML=`<div class="layout">${nav()}<main class="main">${topbar()}<div class="content">${sections[page]()}<div class="footer-note">本页面为离线交互式原型。NDI、ONNX 推理、GPU 指标及 KMBox 通信均为模拟展示，不会连接或操作真实设备。</div></div></main></div>`;lastRenderTS=performance.now();}
function renderDashboard(){return `${heading('视觉识别控制台','视频预览默认关闭以减少显示开销；NDI 接收与 YOLO 推理可独立继续运行。',`<button class="btn btn-primary" data-action="quick-demo">${ICON('zap')} 一键启动演示</button>`)}<div class="callout mb">${ICON('info')}<span><strong>原型演示：</strong>所有视频画面和性能数据均为模拟。先点击「一键启动演示」，即可体验识别、热键、鼠标控制等交互流程。</span></div><div class="grid cols-4 mb"><div class="metric"><div class="metric-head">NDI 输入 ${ICON('wifi')}</div><div class="metric-value" id="kpi-ndi">${s.ndiConnected?'60':'--'} <span class="small muted">FPS</span></div><div class="metric-foot">${s.ndiConnected?'演示画面 · 1920×1080':'等待 NDI 信号'}</div></div><div class="metric"><div class="metric-head">实时推理 ${ICON('cpu')}</div><div class="metric-value" id="kpi-fps">${s.recognition?'58':'--'} <span class="small muted">FPS</span></div><div class="metric-foot">YOLO26s / ${esc(s.engine.toUpperCase())}</div></div><div class="metric"><div class="metric-head">推理延迟 ${ICON('activity')}</div><div class="metric-value" id="kpi-latency">${s.recognition?'8.4':'--'} <span class="small muted">ms</span></div><div class="metric-foot">仅演示数值 · 非真实 GPU 测量</div></div><div class="metric"><div class="metric-head">KMBox NET ${ICON('mouse')}</div><div class="metric-value" style="font-size:21px">${s.kmConnected?'模拟已连接':'未连接'}</div><div class="metric-foot">设备 A / USB 鼠标输入</div></div></div><div class="hero"><div><div class="card preview-card"><div class="preview-top"><div class="row" style="gap:9px"><span class="live-dot" style="background:${s.ndiConnected?'#4cd7ab':'#ffcc74'}"></span><strong style="font-size:13px">调试视频预览</strong><span class="badge muted">DEMO</span></div><label class="preview-toggle"><span>${s.previewEnabled?'已开启':'已关闭'}</span><input class="toggle" type="checkbox" data-field="previewEnabled" ${s.previewEnabled?'checked':''}/></label>${stateBadge(s.recognition,'检测进行中','未启动识别')}</div>${previewMarkup()}<div class="preview-bottom"><span>${ICON('monitor')} 设备 A → NDI → 设备 B</span><span>点击画面设定参考点 · ${Math.round(s.referenceX*100)}% / ${Math.round(s.referenceY*100)}%</span></div></div><div class="stat-grid"><div class="mini-stat"><div class="small muted">视频源</div><b style="font-size:13px">${s.ndiConnected?'NDI Desktop A':'未连接'}</b></div><div class="mini-stat"><div class="small muted">模型</div><b style="font-size:13px">YOLO26s</b></div><div class="mini-stat"><div class="small muted">识别目标</div><b id="target-count">${s.recognition?'3':'0'}</b></div></div></div><div class="quick-panel"><div class="card"><div class="card-title"><h3>${ICON('settings')} 运行控制</h3><span class="badge ${s.automation?'ok':'muted'}">${s.automation?'运行中':'安全待机'}</span></div><div class="actions-stack"><button class="btn ${s.recognition?'btn-ghost':'btn-primary'}" data-action="recognition">${ICON(s.recognition?'stop':'play')}${s.recognition?'停止识别':'开始识别'}</button><button class="btn ${s.automation?'btn-danger':'btn-success'}" data-action="automation">${ICON(s.automation?'pause':'mouse')}${s.automation?'停止自动化':'启动自动化'}</button><button class="btn btn-ghost" data-action="pause" ${!s.automation?'disabled':''}>${ICON('pause')}${s.paused?'恢复控制':'暂停控制'}</button><button class="btn btn-danger" data-action="emergency">${ICON('shield')}紧急停止</button></div><div class="section-sep"></div><div class="detail-stack"><div class="detail-row"><span class="key">NDI 网络视频</span>${stateBadge(s.ndiConnected,'已连接','断开')}</div><div class="detail-row"><span class="key">推理引擎</span><span class="val accent">${engineLabel(s.engine)} / ${s.precision.toUpperCase()}</span></div><div class="detail-row"><span class="key">KMBox NET</span>${stateBadge(s.kmConnected,'已连接','断开')}</div><div class="detail-row"><span class="key">热键策略</span><span class="val">${s.hotkeys.filter(h=>h.enabled).length} 套配置</span></div></div></div><div class="card"><div class="card-title"><h3>${ICON('clock')} 最近活动</h3><button class="btn btn-ghost btn-sm" data-action="nav" data-page="logs">查看全部 ${ICON('arrow')}</button></div><div class="activity">${s.logs.slice(0,4).map(x=>`<div class="activity-row"><span class="activity-point" style="background:${x.level==='error'?'#ff7288':x.level==='success'?'#4cd7ab':'#b59cff'}"></span><span>${esc(x.message)}</span><span class="activity-time">${x.time}</span></div>`).join('')||'<div class="empty">暂无操作记录</div>'}</div></div></div></div>`}
function previewMarkup(){if(!s.previewEnabled)return `<div class="preview-disabled">${ICON('eye')}<strong>调试预览已关闭 · 推理仍可运行</strong><p>未创建视频 Canvas，也不会执行预览绘制。需要调试检测框、参考点或视频源时再临时开启。</p><button class="btn btn-ghost btn-sm" data-action="toggle-preview">${ICON('eye')} 开启调试预览</button></div>`;return `<div class="preview-screen"><canvas data-preview width="1280" height="720" title="点击设置参考位置"></canvas><div class="preview-labels"><span>SIMULATED NDI</span><span>${s.ndiConnected?'1920×1080 · 60FPS':'NO SOURCE'}</span><span>${s.recognition?'AI DETECT ON':'AI DETECT OFF'}</span></div>${!s.ndiConnected?`<div class="preview-empty">${ICON('monitor')}<strong>等待 NDI 视频源</strong><span>点击「一键启动演示」或前往「设备连接」</span></div>`:''}</div>`}
function switchLine(name,desc,field){return `<label class="switchline"><div><div class="switch-label">${name}</div>${desc?`<div class="switch-desc">${desc}</div>`:''}</div><input class="toggle" type="checkbox" data-field="${field}" ${s[field]?'checked':''}/></label>`}
function inputField(label,field,placeholder='',type='text'){return `<div class="field"><label class="field-label" for="field-${field}">${label}</label><input class="input" id="field-${field}" data-field="${field}" type="${type}" value="${esc(s[field])}" placeholder="${esc(placeholder)}" /></div>`}
function rangeField(label,field,min,max,step=1,unit='',help=''){return `<div class="field"><div class="field-label"><span>${label}</span><span class="muted small">${help}</span></div><div class="range-row"><input type="range" min="${min}" max="${max}" step="${step}" value="${s[field]}" data-field="${field}"/><span class="range-output" data-value-for="${field}">${s[field]}${unit?' '+unit:''}</span></div></div>`}
function selectField(label,field,options,help=''){return `<div class="field"><label class="field-label">${label}</label><select class="select" data-field="${field}">${options.map(([v,l])=>`<option value="${esc(v)}" ${String(s[field])===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>${help?`<div class="field-help">${help}</div>`:''}</div>`}
function renderDevices(){const sources=[['source-1','NDI Desktop / 设备 A','1920×1080 · 60fps · LAN'],['source-2','OBS NDI Output','1920×1080 · 30fps · LAN'],['source-3','Camera Bridge NDI','1280×720 · 60fps · LAN']];return `${heading('设备连接','NDI 从设备 A 推送到设备 B；KMBox NET 由设备 B 发命令，再通过 USB 操作设备 A。',`<button class="btn btn-ghost" data-action="scan">${ICON('refresh')} 搜索 NDI 设备</button>`)}<div class="grid cols-2"><section class="card"><div class="card-title"><h3>${ICON('monitor')} NDI 网络视频</h3>${stateBadge(s.ndiConnected,'模拟已连接','未连接')}</div><div class="panel-sub">在局域网内发现设备 A 的 NDI 推流。原型中的设备列表仅为模拟示例。</div>${switchLine('显示调试预览','默认关闭。关闭预览渲染，但不停止 NDI 接收或 AI 推理。','previewEnabled')}${selectField('调试预览刷新率','previewFps',[[5,'5 FPS · 最省资源'],[10,'10 FPS'],[15,'15 FPS · 推荐'],[30,'30 FPS'],[60,'60 FPS']],'只限制 UI 预览帧率，不限制模型推理帧率。')}<div class="field"><label class="field-label">发现的视频源</label>${s.discovered?sources.map(([id,title,sub])=>`<div class="discovery-item ${s.source===id?'active':''}" data-action="source" data-id="${id}">${ICON('monitor')}<div><div class="discovery-title">${title}</div><div class="discovery-sub">${sub}</div></div><span class="radio"></span></div>`).join(''):`<div class="notice">尚未扫描设备。点击右上角「搜索 NDI 设备」，显示三路演示源。</div>`}</div><div class="row"><button class="btn ${s.ndiConnected?'btn-danger':'btn-primary'}" data-action="ndi-toggle">${ICON(s.ndiConnected?'stop':'wifi')} ${s.ndiConnected?'断开 NDI':'连接 NDI（演示）'}</button><span class="small muted">仅模拟连接状态</span></div><div class="section-sep"></div><div class="detail-stack"><div class="detail-row"><span class="key">接收分辨率</span><span class="val">${s.ndiConnected?s.ndiResolution:'—'}</span></div><div class="detail-row"><span class="key">输入帧率</span><span class="val">${s.ndiConnected?'60 FPS（模拟）':'—'}</span></div><div class="detail-row"><span class="key">连接方式</span><span class="val">局域网 NDI</span></div></div></section><section class="card"><div class="card-title"><h3>${ICON('mouse')} KMBox NET</h3>${stateBadge(s.kmConnected,'模拟已连接','未连接')}</div><div class="panel-sub">由设备 B 通过局域网访问 KMBox NET。鼠标输入经 KMBox 的 USB 接口送给设备 A。</div><div class="input-inline">${inputField('设备 IP','kmIp','192.168.1.88')}${inputField('通信端口','kmPort','12498')}</div>${inputField('UID / 设备标识','kmUuid','按实际 SDK/固件填写')}${switchLine('启用加密通信（配置示意）','需要固件与 SDK 实际支持','kmEncrypt')}<div class="row mt"><button class="btn ${s.kmConnected?'btn-danger':'btn-primary'}" data-action="km-toggle">${ICON('mouse')} ${s.kmConnected?'断开 KMBox':'连接 KMBox（演示）'}</button><button class="btn btn-ghost" data-action="test-move" ${!s.kmConnected?'disabled':''}>${ICON('arrow')} 模拟测试移动</button></div><div class="section-sep"></div><div class="detail-stack"><div class="detail-row"><span class="key">控制命令</span><span class="val">UDP / SDK（待实机适配）</span></div><div class="detail-row"><span class="key">目标计算机</span><span class="val">设备 A</span></div><div class="detail-row"><span class="key">鼠标输出形式</span><span class="val">相对位移</span></div></div></section></div><div class="device-path"><div class="path-node">${ICON('monitor')}<strong>设备 A · 目标电脑</strong><span>仅推送 NDI + 接收 KMBox 鼠标输入</span></div><div class="path-line">NDI 画面 →<br/>← KMBox 指令${ICON('arrow')}</div><div class="path-node">${ICON('cpu')}<strong>设备 B · AI 推理电脑</strong><span>运行完整软件 / RTX 3060 / YOLO26s</span></div></div><div class="callout slim mt">${ICON('shield')}<span>设备 A 不需要安装本 AI 推理软件，只需要已有的 NDI 发送能力，并将 KMBox 的鼠标 USB 输出连接至设备 A。</span></div>`}
function engineLabel(v){return ({auto:'Auto',trt:'TensorRT','trt-rtx':'TensorRT for RTX',cuda:'CUDA',directml:'DirectML',cpu:'CPU'})[v]||v}
function renderInference(){const engines=[['auto','自动选择','兼容优先'],['trt','TensorRT','NVIDIA 高性能'],['trt-rtx','TensorRT for RTX','RTX 专用'],['cuda','CUDA','NVIDIA GPU'],['directml','DirectML','Windows GPU'],['cpu','CPU','兼容运行']];return `${heading('模型与推理','为 RTX 3060 选择推理引擎，配置精度、帧率与引擎缓存。',`<button class="btn btn-primary" data-action="benchmark">${ICON('activity')} ${busy?'测试中':'运行模拟基准测试'}</button>`)}<div class="grid cols-2"><section class="card"><div class="card-title"><h3>${ICON('file')} ONNX 模型</h3><span class="badge muted">示例参数</span></div><div class="model-box"><div class="model-icon">${ICON('cpu')}</div><div><div class="model-name">${esc(s.modelName)}</div><div class="model-caption">YOLO26s · 7 类 · FP32 输入</div></div><span class="right badge ok">已配置</span></div><div class="section-sep"></div><div class="grid cols-2"><div class="detail-stack"><div class="detail-row"><span class="key">输入尺寸</span><b>640 × 640</b></div><div class="detail-row"><span class="key">输入张量</span><b>[1,3,640,640]</b></div></div><div class="detail-stack"><div class="detail-row"><span class="key">输出尺寸</span><b>[1,300,6]</b></div><div class="detail-row"><span class="key">检测类别</span><b>7</b></div></div></div><div class="section-sep"></div><div class="field"><label class="field-label">模型路径（展示字段）</label><input class="input" data-field="modelName" value="${esc(s.modelName)}" /></div><div class="notice">${ICON('info')} 更改此处文件名只会影响原型显示，不会在浏览器中真实解析或运行 ONNX。正式客户端需要调用本地 Rust/ONNX Runtime 后端。</div></section><section class="card"><div class="card-title"><h3>${ICON('cpu')} 计算设备</h3><span class="badge ok">RTX 3060</span></div><div class="model-box"><div class="model-icon">${ICON('zap')}</div><div><div class="model-name">NVIDIA GeForce RTX 3060</div><div class="model-caption">GPU 设备 B · CUDA / TensorRT 候选</div></div></div><div class="section-sep"></div><div class="field"><label class="field-label">推理引擎</label><div class="engines">${engines.map(([v,t,d])=>`<button class="engine ${s.engine===v?'selected':''}" data-action="engine" data-value="${v}"><strong>${t}</strong><span>${d}</span></button>`).join('')}</div></div><div class="field"><label class="field-label">推理精度</label><div class="segmented"><button class="${s.precision==='fp32'?'selected':''}" data-action="precision" data-value="fp32">FP32</button><button class="${s.precision==='fp16'?'selected':''}" data-action="precision" data-value="fp16">FP16</button><button disabled title="需量化/校准支持">INT8 · 待支持</button></div><div class="field-help">真实软件应根据驱动、算子和 EP 可用性验证组合；此处只展示配置交互。</div></div>${rangeField('推理 FPS 上限','fpsCap',15,240,5,'FPS')}${switchLine('启用引擎缓存','减少 TensorRT 重复构建等待','engineCache')}</section></div><div class="card mt"><div class="card-title"><h3>${ICON('activity')} 推理性能对比</h3><span class="badge warn">演示数据 · 非实测</span></div><div class="panel-sub">点击右上角「运行模拟基准测试」，查看不同引擎的性能比较页面效果。真实版本需要固定测试帧、预热和实际 CUDA/TRT 执行验证。</div><div class="log-table-wrapper"><table class="bench-table"><thead><tr><th>引擎</th><th>精度</th><th>平均耗时</th><th>P95 延迟</th><th>有效 FPS</th><th>说明</th></tr></thead><tbody>${s.benchmark?s.benchmark.map(x=>`<tr><td>${x.engine}</td><td>${x.precision}</td><td>${x.avg}</td><td>${x.p95}</td><td>${x.fps}</td><td><span class="badge warn">模拟</span></td></tr>`).join(''):'<tr><td colspan="6" class="empty">暂无模拟测试结果</td></tr>'}</tbody></table></div></div>`}
function renderHotkeys(){
 const h=selectedHotkey();
 if(!h)return heading('热键管理','无热键配置')+`<button class="btn btn-primary" data-action="add-hotkey">添加配置</button>`;
 const keys=bindingKeys(h), signature=normalizedSignature(h);
 const other=s.hotkeys.some(x=>x.id!==h.id&&x.enabled&&normalizedSignature(x)===signature);
 const duplicate=keys.length>1&&keys[0]===keys[1];
 const keySelect=slot=>`<div class="field"><label class="field-label">${slot===0?'按键 A':'按键 B · 必须同时按住'}</label><select class="select" data-key-slot="${slot}">${[...hotkeyOptions,...(keys[slot]&&!hotkeyOptions.some(([v])=>v===keys[slot])?[[keys[slot],keys[slot]]]:[])].filter(([v])=>v!=='F8'||keys[slot]==='F8').map(([v,n])=>`<option value="${esc(v)}" ${keys[slot]===v?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`;
 const scopeButton=(value,name)=>`<button class="${h.scope===value?'selected':''}" data-action="hotkey-scope" data-value="${value}">${name}</button>`;
 return `${heading('热键管理','一个热键可管理全部目标类别，也可指定某个类别；支持鼠标左键、右键、侧键及同时按住的组合触发。',`<button class="btn btn-primary" data-action="add-hotkey">${ICON('plus')} 新建热键方案</button>`)}
 <div class="grid hotkey-layout">
  <section class="card">
   <div class="card-title"><h3>${ICON('keyboard')} 热键配置列表</h3><span class="badge muted">${s.hotkeys.length} 组</span></div>
   <div class="profile-list">${s.hotkeys.map(p=>`<button class="profile-item ${p.id===h.id?'active':''}" data-action="select-hotkey" data-id="${p.id}"><span class="icon-square">${ICON('keyboard')}</span><div><div class="profile-title">${esc(p.name)}</div><div class="profile-sub">${esc(bindingLabel(p))} · ${p.mode==='hold'?'按住运行':'切换运行'} · ${p.scope==='all'?'全部已启用类别':p.scope==='custom'?'自选多类别':'类别 '+p.classId}</div></div><span class="rightmark badge ${p.enabled?'ok':'muted'}">${p.enabled?'启用':'关闭'}</span></button>`).join('')}</div>
   <div class="hotkey-hint mt"><strong>组合触发示例：</strong>「鼠标右键 + 鼠标左键」设置为按住模式后，必须两键同时按下才进入模拟跟随；松开任何一个立即停止。<br>热键检测只用于原型演示，真实跨设备监听由 KMBox/Windows SDK 接入。</div>
   <div class="key-status-panel"><strong>输入监听范围</strong>：键盘仅在当前网页获得焦点时有效；鼠标左/右/中/侧键仅在右侧的「鼠标试按区」内捕获。浏览器不能代替设备 A 的真实全局按键监听。</div>
  </section>
  <section class="card">
   <div class="card-title"><h3>${ICON('settings')} 编辑热键方案</h3><button class="btn btn-danger btn-sm" data-action="delete-hotkey" ${s.hotkeys.length<=1?'disabled':''}>${ICON('trash')} 删除</button></div>
   <div class="field"><label class="field-label">方案名称</label><input class="input" data-hotkey-field="name" value="${esc(h.name)}" /></div>
   <div class="field"><label class="field-label">热键触发类型</label><div class="segmented"><button class="${h.trigger==='single'?'selected':''}" data-action="hotkey-trigger" data-value="single">单键触发</button><button class="${h.trigger==='combo'?'selected':''}" data-action="hotkey-trigger" data-value="combo">组合触发 · 同时按住（AND）</button></div></div>
   <div class="key-config-grid">${keySelect(0)}${h.trigger==='combo'?keySelect(1):''}</div>
   <div class="key-option-bar"><button class="btn btn-ghost btn-sm" data-action="hotkey-preset" data-preset="right-left">${ICON('mouse')} 右键 + 左键</button><button class="btn btn-ghost btn-sm" data-action="hotkey-preset" data-preset="side">侧键 Mouse5</button><button class="btn btn-ghost btn-sm ${recording?.id===h.id?'recording':''}" data-action="record-hotkey" data-slot="0">${ICON('keyboard')} ${recording?.id===h.id?'录制中 · Esc 取消':'录制按键 A'}</button>${h.trigger==='combo'?`<button class="btn btn-ghost btn-sm" data-action="record-hotkey" data-slot="1">录制按键 B</button>`:''}</div>
   <div class="hotkey-scope-note">当前组合：<span class="key-cap">${esc(bindingLabel(h))}</span>。鼠标键可直接从下拉菜单选择，或者在下方试按区录制。</div>
   ${duplicate?`<div class="callout slim mb">${ICON('info')}两个键位不能相同，已禁止此组合触发。</div>`:''}
   ${other?`<div class="callout slim mb">${ICON('info')}当前绑定与另一组已启用的热键完全相同，请修改以避免重复触发。</div>`:''}
   <div class="field"><label class="field-label">触发方式</label><div class="segmented"><button class="${h.mode==='hold'?'selected':''}" data-action="hotkey-mode" data-value="hold">按住运行 · 松开停止</button><button class="${h.mode==='toggle'?'selected':''}" data-action="hotkey-mode" data-value="toggle">按一次开启 / 再按关闭</button></div></div>
   <div class="section-sep"></div>
   <div class="field"><label class="field-label">一个热键控制的目标类别范围</label><div class="segmented">${scopeButton('all','全部已启用类别')}${scopeButton('single','指定一个类别')}${scopeButton('custom','自定义多类别')}</div></div>
   ${h.scope==='all'?`<div class="hotkey-hint">当前热键同时管理 <strong>${s.enabledClasses.length} 个已启用类别</strong>：${s.enabledClasses.map(i=>'类别 '+i).join('、')||'无'}。启用/禁用类别请到「目标识别」页面操作。</div>`:''}
   ${h.scope==='single'?`<div class="field"><label class="field-label">跟随目标类别</label><select class="select" data-hotkey-field="classId">${classes.map((c,i)=>`<option value="${i}" ${h.classId===i?'selected':''}>类别 ${i} · ${esc(c)}</option>`).join('')}</select></div>`:''}
   ${h.scope==='custom'?`<div class="hotkey-scope-note">同一热键同时跟随多个指定类别（也受全局类别过滤限制）：</div><div class="hotkey-class-grid">${classes.map((c,i)=>`<label class="hotkey-class-item"><input type="checkbox" data-hotkey-class="${i}" ${h.classIds.includes(i)?'checked':''}/><strong>类别 ${i}</strong><span>${esc(c)}</span></label>`).join('')}</div>`:''}
   <div class="field"><label class="field-label">此热键识别置信度</label><div class="range-row"><input type="range" min="0.1" max="0.95" step="0.05" data-hotkey-field="conf" value="${h.conf}"/><span class="range-output" data-hotkey-value="conf">${h.conf}</span></div></div>
   <label class="switchline"><div><div class="switch-label">启用该热键方案</div><div class="switch-desc">关闭后忽略对应热键输入</div></div><input class="toggle" type="checkbox" data-hotkey-field="enabled" ${h.enabled?'checked':''}/></label>
   <div class="section-sep"></div>
   <div class="card-title"><h3>${ICON('zap')} 组合触发测试</h3><span class="badge muted">仅模拟，不控制真实鼠标</span></div>
   <div class="key-caps"><span class="key-cap">${esc(bindingLabel(h))}</span><span class="muted small">${h.mode==='hold'?'全部按住才执行，释放任一键停止':'全部按下触发一次，必须先松开才能再次触发'}</span></div>
   <div class="hotkey-test-zone" data-hotkey-test-zone tabindex="0" aria-label="鼠标热键测试区">
     ${ICON('mouse')}<strong>鼠标试按区</strong><p>把鼠标放在此区域，真实按住鼠标左右键、侧键测试组合。<br>浏览器可能拦截某些侧键；也可使用下方模拟按键按钮。</p>
     <div class="key-pressed-group">${keys.map(k=>`<span class="key-pressed ${downKeys.has(k)||demoHeld.has(k)?'pressed':''}" data-key-led="${esc(k)}">${esc(prettyKey(k))}</span>`).join('')}</div>
     <span class="hotkey-test-state ${s.automation&&s.activeHotkeyId===h.id?'on':''}" id="hotkey-test-state">${s.automation&&s.activeHotkeyId===h.id?'已触发 · 模拟跟随中':'等待组合键输入'}</span>
   </div>
   <div class="row" style="gap:7px;flex-wrap:wrap">${keys.map((k,i)=>`<button class="btn ${demoHeld.has(k)?'btn-success':'btn-ghost'} btn-sm" data-action="demo-key" data-key="${esc(k)}">${demoHeld.has(k)?'释放':'模拟按住'} ${i===0?'A':'B'} · ${esc(prettyKey(k))}</button>`).join('')}<button class="btn btn-ghost btn-sm" data-action="demo-release">释放全部测试键</button><button class="btn btn-danger btn-sm" data-action="emergency">${ICON('shield')} 紧急停止</button></div>
   <div class="notice mt">先在总览点击「一键启动演示」。之后按住 A+B 时只改变模拟控制状态；此 HTML 不会连接 KMBox，也不会操作设备 A。</div>
  </section>
 </div>`;
}
function renderTargets(){return `${heading('目标识别','筛选 YOLO 模型的类别，设置置信度、识别范围与目标偏移。',`<button class="btn btn-ghost" data-action="reset-targets">${ICON('refresh')} 恢复识别默认值</button>`)}<div class="grid cols-2"><section class="card"><div class="card-title"><h3>${ICON('crosshair')} 识别参数</h3><span class="badge muted">YOLO26s</span></div>${rangeField('置信度阈值','conf',.10,.95,.05)}${rangeField('IoU 阈值','iou',.10,.95,.05,'','部分后处理策略使用')}${selectField('目标选择策略','targetPolicy',[['nearest','距离参考点最近'],['largest','检测框最大'],['confidence','置信度最高']])}${rangeField('有效检测范围','range',40,500,10,'px')}${rangeField('X 参考偏移','offsetX',-1,1,.05)}${rangeField('Y 参考偏移','offsetY',-1,1,.05)}${switchLine('显示检测框','将推理输出叠加到 NDI 画面','overlay')}${switchLine('显示有效范围','预览中的参考点与检测圆','rangeOverlay')}</section><section class="card"><div class="card-title"><h3>${ICON('grid')} 目标类别过滤</h3><span class="badge muted">${s.enabledClasses.length}/7 已启用</span></div><div class="panel-sub">下方为参考 ONNX 模型的七个类别。类别名称可在后续版本中重命名。</div><div class="class-grid">${classes.map((c,i)=>`<label class="class-item"><input type="checkbox" data-class="${i}" ${s.enabledClasses.includes(i)?'checked':''}/><span class="color-box" style="background:${classColors[i]}"></span><strong>类别 ${i}</strong><span>${c}</span></label>`).join('')}</div><div class="section-sep"></div><div class="card-title"><h3>${ICON('monitor')} 识别区域预览</h3><button class="btn btn-ghost btn-sm" data-action="toggle-preview">${s.previewEnabled?'关闭预览':'开启预览'}</button></div><div class="preview-card card" style="margin:0">${previewMarkup()}<div class="preview-bottom"><span>点击预览更改参考点</span><span>范围：${s.range} px</span></div></div><div class="notice mt">目标检测框以及模拟画面中的对象仅用于 UI 演示，不代表真实 ONNX 识别结果。</div></section></div>`}
function renderMotion(){return `${heading('鼠标控制','基于 NDI 坐标与 KMBox 相对位移的控制校准及运动平滑。',`<button class="btn btn-ghost" data-action="reset-motion">${ICON('refresh')} 恢复默认值</button>`)}<div class="grid cols-2"><section class="card"><div class="card-title"><h3>${ICON('mouse')} 运动参数</h3><span class="badge muted">相对位移</span></div>${switchLine('启用平滑移动','对离散鼠标位移进行平滑处理','smooth')}${selectField('移动曲线','curve',[['linear','线性移动'],['ease','缓入缓出（推荐）'],['expo','指数平滑']])}${rangeField('水平移动系数','speedX',.05,1,.01)}${rangeField('垂直移动系数','speedY',.05,1,.01)}${rangeField('鼠标死区','deadzone',0,20,.5,'px')}${rangeField('单次最大位移','maxStep',5,120,5,'px')}${switchLine('失去目标时自动停止','检测中断时禁止继续发出控制指令','autoStop')}</section><section class="card"><div class="card-title"><h3>${ICON('crosshair')} 坐标校准与安全</h3><span class="badge warn">真实硬件待接入</span></div><div class="notice"><strong>为什么需要校准？</strong><br/>YOLO 输出的是视频中的像素坐标，KMBox 接口需要的是鼠标相对移动量。NDI 视频比例、视野映射与操作系统鼠标设置可能导致两者不一致。</div><div class="section-sep"></div>${rangeField('X 位移增益','gainX',.1,3,.1)}${rangeField('Y 位移增益','gainY',.1,3,.1)}<div class="field"><label class="field-label">测试相对移动（仅模拟）</label><div class="row"><button class="btn btn-ghost" data-action="move-demo" data-dx="-10" data-dy="0">${ICON('arrow')} X -10</button><button class="btn btn-ghost" data-action="move-demo" data-dx="10" data-dy="0">${ICON('arrow')} X +10</button><button class="btn btn-ghost" data-action="move-demo" data-dx="0" data-dy="-10">Y -10</button><button class="btn btn-ghost" data-action="move-demo" data-dx="0" data-dy="10">Y +10</button></div></div><div class="callout slim">${ICON('shield')}<span>紧急停止优先级最高：禁止发送新动作、清空待执行队列、释放已按下按键（实际连接断开时需额外提示）。</span></div><div class="section-sep"></div><div class="detail-stack"><div class="detail-row"><span class="key">控制方向</span><b>设备 B → KMBox NET → 设备 A</b></div><div class="detail-row"><span class="key">控制状态</span>${stateBadge(s.automation,'演示运行中','已停止')}</div><div class="detail-row"><span class="key">紧急停止热键</span><span class="key-cap" style="padding:5px 10px">F8</span></div></div></section></div>`}
function renderLogs(){return `${heading('运行日志','按时间查看原型中的操作事件；正式软件还将显示 NDI/ONNX/KMBox 错误。',`<button class="btn btn-ghost" data-action="log-export">${ICON('download')} 导出日志</button><button class="btn btn-danger" data-action="log-clear">${ICON('trash')} 清空</button>`)}<div class="card"><div class="card-title"><h3>${ICON('file')} 事件记录</h3><span class="badge muted">${s.logs.length} 条</span></div><div class="log-table-wrapper"><table class="log-table"><thead><tr><th>时间</th><th>级别</th><th>事件详情</th></tr></thead><tbody>${s.logs.length?s.logs.map(x=>`<tr><td style="white-space:nowrap">${x.time}</td><td><span class="badge ${x.level==='error'?'bad':x.level==='success'?'ok':'muted'}">${x.level==='error'?'错误':x.level==='success'?'成功':'信息'}</span></td><td>${esc(x.message)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">暂无事件。可切换至「总览」进行演示操作。</td></tr>'}</tbody></table></div></div>`}
function stopAutomation(message,clearInputs=false){const had=s.automation||s.paused;s.automation=false;s.paused=false;s.activeHotkeyId=null;activeHoldId=null;if(clearInputs){downKeys.clear();demoHeld.clear();keyLatch.clear();}if(had)log('info',message||'自动控制已停止（模拟）');}
function resetControl(){stopAutomation('紧急停止：已清空演示控制状态',true);log('error','紧急停止已触发：不向真实设备发送任何命令');toast('紧急停止已触发，模拟控制状态已清空','error');render();}
function toggleRecognition(){if(s.recognition){s.recognition=false;stopAutomation('停止识别，自动控制一并停止',true);log('info','已停止 AI 识别（模拟）');}else{if(!s.ndiConnected){toast('请先连接演示 NDI 视频源','error');return;}s.recognition=true;log('success','YOLO26s 识别已启动（模拟）');}render()}
function toggleAutomation(){if(s.automation){stopAutomation('用户主动停止自动化',true);toast('自动化控制已停止','success');render();return;}if(!s.recognition||!s.kmConnected){toast('先开启 NDI、AI 识别并连接 KMBox（演示）','error');return;}s.automation=true;s.paused=false;s.activeHotkeyId=null;log('success','自动化控制已启用（仅状态模拟）');toast('模拟自动控制已启动，不会操作真实鼠标','success');render()}
function fireHotkey(h){if(!h||!h.enabled)return;if(!s.recognition||!s.kmConnected){toast('请先在总览启动演示链路','error');return;}if(!classSetFor(h).length){toast('该热键没有可用的目标类别，请检查类别配置','error');return;}if(h.mode==='toggle'){
   if(s.automation){stopAutomation(`${h.name} 再次触发，切换为停止`);}
   else{s.automation=true;s.paused=false;s.activeHotkeyId=h.id;log('success',`${h.name} 切换为模拟跟随 · ${classSetFor(h).length} 类`);}
 }else{
   if(activeHoldId!==null&&activeHoldId!==h.id)return;
   if(!s.automation){s.automation=true;s.paused=false;activeHoldId=h.id;s.activeHotkeyId=h.id;log('success',`${h.name} 组合键全部按下 · 开始模拟跟随`);}
 }
 render();
}
function evaluateBindings(){
 const pressed=new Set([...downKeys,...demoHeld]);
 const ordered=[...s.hotkeys].filter(h=>h.enabled).sort((a,b)=>bindingKeys(b).length-bindingKeys(a).length);
 for(const h of ordered){
  const keys=bindingKeys(h);
  const satisfied=keys.length>0&&new Set(keys).size===keys.length&&keys.every(k=>pressed.has(k));
  const old=keyLatch.has(h.id);
  if(satisfied&&!old){keyLatch.add(h.id);fireHotkey(h);}
  else if(!satisfied&&old){keyLatch.delete(h.id);if(h.mode==='hold'&&activeHoldId===h.id){stopAutomation(`${h.name} 组合键已释放 · 停止模拟跟随`);render();}}
 }
 updateKeyIndicators();
}
function updateKeyIndicators(){document.querySelectorAll('[data-key-led]').forEach(el=>el.classList.toggle('pressed',downKeys.has(el.dataset.keyLed)||demoHeld.has(el.dataset.keyLed)));const h=selectedHotkey();const status=document.getElementById('hotkey-test-state');if(status&&h){const isOn=s.automation&&s.activeHotkeyId===h.id;status.textContent=isOn?'已触发 · 模拟跟随中':'等待组合键输入';status.classList.toggle('on',isOn);}document.querySelectorAll('[data-action="demo-key"]').forEach(el=>{const on=demoHeld.has(el.dataset.key);el.classList.toggle('btn-success',on);el.classList.toggle('btn-ghost',!on);el.textContent=(on?'释放':'模拟按住')+' '+(bindingKeys(h)[0]===el.dataset.key?'A':'B')+' · '+prettyKey(el.dataset.key);});}
function recordHotkey(code){if(recording===null)return;const h=s.hotkeys.find(x=>x.id===recording.id);if(!h)return;if(code==='F8'){recording=null;render();toast('F8 为紧急停止专用热键，不允许覆盖','error');return;}const slot=recording.slot;if(!hotkeyNames[code])hotkeyOptions.push([code,code]);h.keys[slot]=code;if(h.trigger==='single')h.keys=h.keys.slice(0,1);h.key=h.keys.join('+');recording=null;stopAutomation('重新录制热键时停止控制',true);save();render();toast('已录入 '+prettyKey(code),'success');}
function download(filename,text,mime='application/json'){const blob=new Blob([text],{type:mime+';charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function act(action,button){switch(action){
 case 'nav':page=button.dataset.page;recording=null;demoHeld.clear();evaluateBindings();render();window.scrollTo(0,0);break;
 case 'quick-demo':s.ndiConnected=true;s.kmConnected=true;s.discovered=true;s.recognition=true;stopAutomation('重新启动演示链路',true);log('success','一键启动演示：NDI、KMBox、模型识别已模拟就绪（视频预览独立开关）');toast('演示链路已就绪，预览默认关闭；可以测试组合热键','success');render();break;
 case 'toggle-preview':s.previewEnabled=!s.previewEnabled;log('info',s.previewEnabled?'已开启调试预览（仅模拟渲染）':'已关闭调试预览（不影响识别）');save();render();break;
 case 'scan':s.discovered=true;log('info','扫描到 3 路 NDI 演示源');toast('发现 3 路模拟 NDI 视频源','success');render();break;
 case 'source':s.source=button.dataset.id;s.ndiSource=({'source-1':'NDI Desktop / 设备 A','source-2':'OBS NDI Output','source-3':'Camera Bridge NDI'})[s.source];if(s.ndiConnected){s.ndiConnected=false;s.recognition=false;stopAutomation('切换 NDI 源时自动停止控制',true);}log('info','已选择 NDI 源：'+s.ndiSource+'（模拟）');render();break;
 case 'ndi-toggle':s.ndiConnected=!s.ndiConnected;if(!s.ndiConnected){s.recognition=false;stopAutomation('NDI 断开：自动停止控制',true);}log(s.ndiConnected?'success':'info',`NDI ${s.ndiConnected?'模拟连接成功':'已断开'}`);toast(s.ndiConnected?'NDI 已模拟连接':'NDI 已断开');render();break;
 case 'km-toggle':s.kmConnected=!s.kmConnected;if(!s.kmConnected)stopAutomation('KMBox 断开：自动停止控制',true);log(s.kmConnected?'success':'info',`KMBox NET ${s.kmConnected?'模拟连接成功':'已断开'}`);toast(s.kmConnected?'KMBox 已模拟连接':'KMBox 已断开');render();break;
 case 'test-move':log('info','KMBox 模拟测试鼠标相对移动：dx=10,dy=0');toast('仅模拟移动指令，没有向设备发送任何数据');render();break;
 case 'recognition':toggleRecognition();break;
 case 'automation':toggleAutomation();break;
 case 'pause':if(!s.automation)return;s.paused=!s.paused;log('info',s.paused?'已暂停自动化控制（模拟）':'已恢复自动化控制（模拟）');render();break;
 case 'emergency':resetControl();break;
 case 'engine':s.engine=button.dataset.value;if(s.engine==='cpu'&&s.precision==='fp16'){s.precision='fp32';toast('CPU 模式自动切换为 FP32');}stopAutomation('更换推理引擎，先停止自动控制',true);s.recognition=false;log('info','选择推理引擎：'+engineLabel(s.engine)+'（仅配置）');save();render();break;
 case 'precision':s.precision=button.dataset.value;if(s.engine==='cpu'&&s.precision==='fp16'){s.precision='fp32';toast('CPU 演示模式不使用 FP16','error');}stopAutomation('修改精度，先停止自动控制',true);s.recognition=false;save();render();break;
 case 'benchmark':if(busy)return;busy=true;toast('生成模拟性能结果（非实测）');setTimeout(()=>{s.benchmark=[{engine:'CUDA',precision:'FP32',avg:'15.6 ms',p95:'18.8 ms',fps:'64'},{engine:'TensorRT',precision:'FP16',avg:'8.4 ms',p95:'10.2 ms',fps:'119'},{engine:'CPU',precision:'FP32',avg:'87.5 ms',p95:'96.1 ms',fps:'11'}];busy=false;log('info','模拟推理基准测试已生成；未实际运行 ONNX');render();toast('已生成模拟测试表格','success')},850);break;
 case 'add-hotkey':{let id=Math.max(0,...s.hotkeys.map(h=>h.id))+1;const used=s.hotkeys.map(bindingLabel);const key=['F9','F10','F11','F12','Mouse4','Mouse5'].find(k=>!used.includes(prettyKey(k)))||'F9';s.hotkeys.push({id,name:'热键 '+id+' · 自定义',key,keys:[key],trigger:'single',mode:'hold',scope:'all',classId:0,classIds:[...s.enabledClasses],conf:.55,enabled:true});s.selectedHotkey=id;log('info','新增热键方案 '+id);save();render();break;}
 case 'select-hotkey':{stopAutomation('更换热键配置，停止旧方案',true);s.selectedHotkey=Number(button.dataset.id);render();break;}
 case 'delete-hotkey':if(s.hotkeys.length<=1)return;stopAutomation('删除热键配置，停止控制',true);s.hotkeys=s.hotkeys.filter(h=>h.id!==s.selectedHotkey);s.selectedHotkey=s.hotkeys[0].id;log('info','删除热键方案（仅配置）');save();render();break;
 case 'record-hotkey':recording={id:s.selectedHotkey,slot:Number(button.dataset.slot)||0};render();toast('在试按区按鼠标键，或在当前页面按键盘按键；Esc 取消');break;
 case 'hotkey-mode':{let h=selectedHotkey();h.mode=button.dataset.value;stopAutomation('切换热键模式',true);save();render();break;}
 case 'hotkey-trigger':{let h=selectedHotkey();h.trigger=button.dataset.value;if(h.trigger==='combo'){if(!h.keys[1])h.keys[1]=h.keys[0]==='MouseRight'?'MouseLeft':'MouseRight';}else h.keys=h.keys.slice(0,1);h.key=h.keys.join('+');stopAutomation('切换组合触发模式',true);save();render();break;}
 case 'hotkey-scope':{let h=selectedHotkey();h.scope=button.dataset.value;stopAutomation('切换热键目标范围',true);save();render();break;}
 case 'hotkey-preset':{let h=selectedHotkey();if(button.dataset.preset==='right-left'){h.trigger='combo';h.keys=['MouseRight','MouseLeft'];h.mode='hold';}else{h.trigger='single';h.keys=['Mouse5'];}h.key=h.keys.join('+');stopAutomation('设置热键预设',true);save();render();toast('已应用触发键预设','success');break;}
 case 'demo-key':{const k=button.dataset.key;demoHeld.has(k)?demoHeld.delete(k):demoHeld.add(k);evaluateBindings();break;}
 case 'demo-release':demoHeld.clear();downKeys.clear();evaluateBindings();render();break;
 case 'reset-targets':{const d=defaults();for(let k of ['conf','iou','targetPolicy','range','offsetX','offsetY','enabledClasses','overlay','rangeOverlay','referenceX','referenceY'])s[k]=d[k];save();render();toast('已恢复目标识别参数');break;}
 case 'reset-motion':{const d=defaults();for(let k of ['smooth','curve','speedX','speedY','gainX','gainY','deadzone','maxStep','autoStop'])s[k]=d[k];save();render();toast('已恢复鼠标控制参数');break;}
 case 'move-demo':if(!s.kmConnected){toast('请先模拟连接 KMBox','error');return;}log('info',`模拟鼠标移动：dx=${button.dataset.dx}, dy=${button.dataset.dy}`);toast('已模拟鼠标位移，不会发送硬件指令');render();break;
 case 'export':{const o={...s,logs:undefined,benchmark:undefined,ndiConnected:false,kmConnected:false,recognition:false,automation:false,paused:false,activeHotkeyId:null};download('NDI_Vision_V1_1_Config.json',JSON.stringify(o,null,2));toast('配置 JSON 已导出','success');break;}
 case 'import':document.getElementById('importConfig').click();break;
 case 'log-export':download('NDI_Vision_V1_1_Logs.txt',s.logs.map(x=>`[${x.time}] ${x.level.toUpperCase()} ${x.message}`).join('\n'),'text/plain');break;
 case 'log-clear':s.logs=[];render();break;
 default:break;
}}

function assign(el,value){const key=el.dataset.field;let v=value;if(el.type==='checkbox')v=el.checked;else if(el.type==='range'||key==='previewFps')v=Number(value);else if(['kmPort','kmIp','kmUuid','modelName'].includes(key))v=String(value);s[key]=v;if(key==='modelName')log('info','更新模型文件展示名称（未实际加载文件）');if(key==='previewEnabled')log('info',v?'已开启调试预览':'已关闭调试预览，推理保持独立运行');save();}
function assignHotkey(el,value){const h=selectedHotkey();if(!h)return;let field=el.dataset.hotkeyField;h[field]=el.type==='checkbox'?el.checked:field==='classId'||field==='conf'?Number(value):value;if(field==='enabled'&&!h.enabled)stopAutomation('热键已禁用',true);save();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){if(b.disabled)return;act(b.dataset.action,b);return;}const c=e.target.closest('canvas[data-preview]');if(c){const r=c.getBoundingClientRect();s.referenceX=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));s.referenceY=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));save();toast(`参考点已设为 ${Math.round(s.referenceX*100)}% / ${Math.round(s.referenceY*100)}%`,'success');}});
document.addEventListener('input',e=>{const x=e.target;if(x.dataset.field!==undefined){assign(x,x.value);document.querySelectorAll(`[data-value-for="${x.dataset.field}"]`).forEach(v=>v.textContent=x.value+(x.dataset.field==='range'||x.dataset.field==='deadzone'||x.dataset.field==='maxStep'?' px':x.dataset.field==='fpsCap'?' FPS':''));}if(x.dataset.hotkeyField!==undefined){assignHotkey(x,x.value);if(x.dataset.hotkeyField==='conf')document.querySelectorAll('[data-hotkey-value="conf"]').forEach(v=>v.textContent=x.value);}});
document.addEventListener('change',e=>{const x=e.target;if(x.dataset.field!==undefined){assign(x,x.value);render();}if(x.dataset.hotkeyField!==undefined){assignHotkey(x,x.value);render();}if(x.dataset.keySlot!==undefined){const h=selectedHotkey();const slot=Number(x.dataset.keySlot);if(x.value==='F8'){toast('F8 保留为紧急停止','error');render();return;}h.keys[slot]=x.value;h.key=h.keys.join('+');stopAutomation('修改触发按键时停止控制',true);save();render();}if(x.dataset.class!==undefined){let i=Number(x.dataset.class);s.enabledClasses=x.checked?[...new Set([...s.enabledClasses,i])].sort():s.enabledClasses.filter(v=>v!==i);save();render();}if(x.dataset.hotkeyClass!==undefined){const h=selectedHotkey(),i=Number(x.dataset.hotkeyClass);h.classIds=x.checked?[...new Set([...h.classIds,i])].sort():h.classIds.filter(v=>v!==i);save();render();}});
function keyCode(e){if(e.key==='Control')return 'Ctrl';if(e.key===' ')return 'Space';if(['Shift','Alt','Meta'].includes(e.key))return e.key;return e.key.length===1?e.key.toUpperCase():e.key;}
function mouseCode(btn){return ({0:'MouseLeft',1:'MouseMiddle',2:'MouseRight',3:'Mouse4',4:'Mouse5'})[btn]||null;}
function isEditing(el){return !!el?.closest('input,textarea,select,[contenteditable="true"]');}
document.addEventListener('keydown',e=>{
 const code=keyCode(e);
 if(recording!==null){e.preventDefault();if(code==='Escape'){recording=null;render();return;}recordHotkey(code);return;}
 if(code==='F8'){e.preventDefault();resetControl();return;}
 if(isEditing(e.target))return;
 if(s.hotkeys.some(h=>h.enabled&&bindingKeys(h).includes(code)))e.preventDefault();
 if(!downKeys.has(code)){downKeys.add(code);evaluateBindings();}
});
document.addEventListener('keyup',e=>{const code=keyCode(e);if(downKeys.delete(code))evaluateBindings();});
document.addEventListener('mousedown',e=>{const key=mouseCode(e.button),zone=e.target.closest('[data-hotkey-test-zone]');if(!key||!zone)return;e.preventDefault();if(recording!==null){recordHotkey(key);return;}if(!downKeys.has(key)){downKeys.add(key);evaluateBindings();}});
document.addEventListener('mouseup',e=>{const key=mouseCode(e.button);if(key&&downKeys.delete(key))evaluateBindings();});
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-hotkey-test-zone]'))e.preventDefault();});
document.addEventListener('auxclick',e=>{if(e.target.closest('[data-hotkey-test-zone]'))e.preventDefault();});
window.addEventListener('blur',()=>{const wasHold=activeHoldId!==null;downKeys.clear();demoHeld.clear();keyLatch.clear();if(wasHold)stopAutomation('浏览器失焦，按住热键安全停止');render();});
const imp=document.getElementById('importConfig');imp.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!v||typeof v!=='object'||!Array.isArray(v.hotkeys))throw Error('格式不正确');s={...defaults(),...v,ndiConnected:false,kmConnected:false,recognition:false,automation:false,paused:false,activeHotkeyId:null,logs:[],benchmark:null};normalizeHotkeys();downKeys.clear();demoHeld.clear();keyLatch.clear();log('success','已导入配置文件：'+f.name);save();render();toast('配置导入成功，硬件状态保持断开','success');}catch(err){toast('配置导入失败：'+err.message,'error')}e.target.value=''});
function drawPreview(c,secs){const ctx=c.getContext('2d');if(!ctx)return;const w=1280,h=720;if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const bg=ctx.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#16233a');bg.addColorStop(.55,'#101b2d');bg.addColorStop(1,'#1f243d');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
// A deliberately synthetic desktop-like scene, not a captured NDI frame.
ctx.fillStyle='#10182a';ctx.fillRect(0,0,w,44);ctx.fillStyle='#252e45';ctx.fillRect(0,42,w,2);ctx.font='15px sans-serif';ctx.fillStyle='#8c9bb6';ctx.fillText('DESKTOP A   /   SYNTHETIC VIDEO SOURCE',28,27);ctx.fillStyle='#28354d';ctx.fillRect(0,45,70,h-45);for(let j=0;j<7;j++){ctx.fillStyle=j===1?'#6657a5':'#42516b';ctx.fillRect(22,85+j*67,26,26)}
ctx.strokeStyle='rgba(145,174,213,.055)';ctx.lineWidth=1;for(let x=70;x<w;x+=45){ctx.beginPath();ctx.moveTo(x,44);ctx.lineTo(x,h);ctx.stroke()}for(let y=44;y<h;y+=45){ctx.beginPath();ctx.moveTo(70,y);ctx.lineTo(w,y);ctx.stroke()}
ctx.fillStyle='#202e45';ctx.fillRect(105,91,1080,546);ctx.fillStyle='#142136';ctx.fillRect(120,112,1050,506);ctx.fillStyle='#293b53';ctx.fillRect(120,112,1050,42);ctx.font='15px sans-serif';ctx.fillStyle='#b8c8e1';ctx.fillText('视觉检测测试场景  /  工作区 01',149,139);
for(let i=0;i<8;i++){const x=148+i*128;ctx.fillStyle=i%2?'#24374f':'#2b3c54';ctx.fillRect(x,545,96,45);ctx.fillStyle='#647992';ctx.fillRect(x+8,561,38,4)}
const objs=[{x:340+Math.sin(secs*.65)*85,y:335+Math.sin(secs*.40)*21,w:105,h:154,c:0},{x:710+Math.cos(secs*.53)*75,y:285+Math.cos(secs*.43)*26,w:83,h:116,c:1},{x:990+Math.sin(secs*.31)*60,y:410+Math.sin(secs*.63)*20,w:105,h:100,c:2}];
objs.forEach((o,i)=>{const color=['#806ba6','#3d899b','#508878'][i];ctx.fillStyle=color+'33';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle=color+'bb';ctx.lineWidth=2;ctx.strokeRect(o.x,o.y,o.w,o.h);ctx.fillStyle='#8fa3c4';ctx.fillRect(o.x+o.w*.24,o.y+15,o.w*.5,7);ctx.fillStyle='#3f526e';ctx.fillRect(o.x+o.w*.2,o.y+o.h-26,o.w*.6,9)});
const rx=s.referenceX*w,ry=s.referenceY*h;ctx.strokeStyle='#9a9eff';ctx.lineWidth=1.5;ctx.globalAlpha=.75;ctx.beginPath();ctx.moveTo(rx-18,ry);ctx.lineTo(rx-5,ry);ctx.moveTo(rx+5,ry);ctx.lineTo(rx+18,ry);ctx.moveTo(rx,ry-18);ctx.lineTo(rx,ry-5);ctx.moveTo(rx,ry+5);ctx.lineTo(rx,ry+18);ctx.stroke();ctx.globalAlpha=1;
if(s.rangeOverlay){ctx.beginPath();ctx.arc(rx,ry,s.range*1.28,0,Math.PI*2);ctx.setLineDash([8,7]);ctx.strokeStyle='#b6a3ff88';ctx.stroke();ctx.setLineDash([])}
if(s.recognition&&s.overlay){objs.forEach((o,i)=>{if(!(s.automation&&s.activeHotkeyId?classSetFor(s.hotkeys.find(h=>h.id===s.activeHotkeyId)):s.enabledClasses).includes(i))return;let color=classColors[i];ctx.strokeStyle=color;ctx.lineWidth=3;ctx.strokeRect(o.x-7,o.y-9,o.w+14,o.h+18);ctx.fillStyle=color;ctx.fillRect(o.x-7,o.y-34,133,24);ctx.fillStyle='#101827';ctx.font='bold 14px sans-serif';ctx.fillText('CLASS '+i+'  '+(0.96-i*.08).toFixed(2),o.x+1,o.y-17);ctx.fillStyle=color;ctx.fillRect(o.x+o.w/2-4,o.y+o.h/2-4,8,8)});}
ctx.fillStyle='#8697b5';ctx.font='13px sans-serif';ctx.fillText('FRAME PREVIEW / DESIGN SIMULATION',95,682);ctx.fillText(s.automation?(s.paused?'CONTROL PAUSED':'CONTROL ENABLED · DEMO'):'CONTROL DISABLED',940,682);
}
function loop(ts){
 if(s.previewEnabled && document.visibilityState!=='hidden' && ts-lastRenderTS>=1000/Math.max(1,Number(s.previewFps)||15)){
  document.querySelectorAll('canvas[data-preview]').forEach(el=>drawPreview(el,ts/1000));lastRenderTS=ts;
 }
 if(ts-lastStatsTS>500){
  const ndi=document.getElementById('kpi-ndi');if(ndi&&s.ndiConnected)ndi.innerHTML=`${59+Math.round(Math.sin(ts/700)*1)} <span class="small muted">FPS</span>`;
  const fps=document.getElementById('kpi-fps');if(fps&&s.recognition)fps.innerHTML=`${Math.min(s.fpsCap,57+Math.round(Math.sin(ts/570)*2))} <span class="small muted">FPS</span>`;
  const lat=document.getElementById('kpi-latency');if(lat&&s.recognition)lat.innerHTML=`${(8.4+Math.sin(ts/480)*.5).toFixed(1)} <span class="small muted">ms</span>`;
  lastStatsTS=ts;
 }
 animationId=s.previewEnabled?requestAnimationFrame(loop):setTimeout(()=>loop(performance.now()),500);
}
log('info','欢迎使用 NDI Vision Studio 交互原型，所有状态为模拟');render();animationId=requestAnimationFrame(loop);
})();
</script>
